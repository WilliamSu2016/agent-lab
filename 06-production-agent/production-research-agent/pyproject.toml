[project]
name = "production-research-agent"
version = "0.1.0"
description = "Production-ready Multi-Agent Research Agent (LangGraph): durable execution, guardrails, observability, cost control, and evaluation, wired end to end."
requires-python = ">=3.10,<3.11"
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "openai>=1.30,<2.0",
    "langgraph>=0.2,<0.3",
    "langgraph-checkpoint>=2.0.10,<3.0",
    "langgraph-checkpoint-sqlite>=2.0,<3.0",
    "typing_extensions>=4.7",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
