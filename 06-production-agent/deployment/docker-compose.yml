# Deployment experiment: Development vs Production, side by side.
#
#   Development (local LangGraph server):
#       docker compose --profile dev up langgraph-dev
#     -- runs `langgraph dev` (the LangGraph CLI's own local dev server)
#     against deployment/langgraph.json, with the repo mounted read-write
#     for live reload. No auth/rate limiting -- a local, single-developer
#     tool, never exposed beyond localhost.
#
#   Production (this project's own FastAPI app):
#       docker compose --profile prod up -d agent-api
#     -- builds deployment/Dockerfile, uses the production SQLite
#     checkpointer on a named, persistent volume (survives container
#     replacement -- the whole point of "durable execution" in a real
#     deployment), and reads every secret/setting from `.env` at container
#     start (never baked into the image -- see Dockerfile).
#
# Neither profile hard-codes a secret value anywhere in this file: real
# values live only in a local `.env` (git-ignored, never committed --
# see .env.example) referenced via `env_file:`.

services:
  langgraph-dev:
    profiles: ["dev"]
    image: python:3.10.8-slim
    working_dir: /repo
    volumes:
      - ..:/repo
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: development
    ports:
      - "8123:8123"
    # langgraph-cli is a dev-only tool -- installed on container start
    # rather than baked into the production image (deployment/Dockerfile
    # never installs it), keeping the production image's dependency
    # surface strictly smaller than the development one.
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt 'langgraph-cli[inmem]' &&
               langgraph dev --config deployment/langgraph.json --host 0.0.0.0 --port 8123 --no-browser"

  agent-api:
    profiles: ["prod"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: production-agent:latest
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      CHECKPOINT_DB_PATH: /app/traces/durable_checkpoints.sqlite3
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_GRACEFUL_SHUTDOWN_SECONDS: "30"
      RATE_LIMIT_MAX_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    ports:
      - "8000:8000"
    volumes:
      # Persistent storage for the production checkpointer (Requirement:
      # "Production: persistent storage, production checkpointer"). Named
      # volume, not a bind mount to a temp dir -- survives
      # `docker compose down` (only `down -v` removes it) and a container
      # replacement/redeploy resumes exactly where the last one left off.
      - checkpoints:/app/traces
    restart: unless-stopped
    # `docker stop` sends SIGTERM; uvicorn's own signal handling plus
    # src.api.app's lifespan shutdown hook drain in-flight runs before
    # exiting (Requirement 9). Give it real headroom before Docker
    # escalates to SIGKILL.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  checkpoints:
